    const allStarred = list.every(t => t.star);
    const tags = app.clientNames();
    host.innerHTML = `<b class="bulk-count">${list.length} selected</b>
      <span class="bulk-seg" role="group" aria-label="Priority">${C.PRIORITIES.map(p => `<button data-act="bulkPriority" data-v="${p}">${C.PRIORITY_LABEL[p]}</button>`).join('')}</span>
      <span class="dots" role="group" aria-label="Colour">${Object.entries(C.COLORS).map(([k, v]) => `<button style="background:${v}" data-act="bulkColor" data-c="${k}" aria-label="Make them ${k}" title="${k}"></button>`).join('')}</span>
      <label class="bulk-field"><span>Due</span><input type="date" id="bulkDue" aria-label="Due date for all selected"></label>
      <label class="bulk-field"><span>Client</span><input id="bulkClient" list="bulkTags" placeholder="Name" aria-label="Client for all selected"><datalist id="bulkTags">${tags.map(x => `<option value="${esc(x)}">`).join('')}</datalist></label>
      <button class="bulk-btn" data-act="bulkStar" title="${allStarred ? 'Remove from' : 'Add to'} Today">${allStarred ? '★' : '☆'} Today</button>
      <button class="bulk-btn go" data-act="bulkDone">✓ Done</button>
      <button class="bulk-btn" data-act="bulkDelete">Delete</button>
      <button class="bulk-x" data-act="bulkClear" aria-label="Clear selection" title="Clear selection (Esc)">✕</button>`;
  }

  const plural = n => `${n} task${n === 1 ? '' : 's'}`;
  function changeAll(label, fn, toast) {
    const list = app.pickedTasks(), now = new Date().toISOString();
    if (!list.length) return;
    app.change(label, () => { for (const t of list) { fn(t); t.updatedAt = now; } }, { toast: toast(list.length) });
  }
  app.actions.bulkPriority = el => changeAll('Change priority', t => { t.priority = el.dataset.v; }, n => `${plural(n)} set to ${C.PRIORITY_LABEL[el.dataset.v]}`);
  app.actions.bulkColor = el => changeAll('Change colour', t => { t.color = el.dataset.c; }, n => `${plural(n)} recoloured`);
  app.actions.bulkStar = () => {
    const star = !app.pickedTasks().every(t => t.star);
    changeAll(star ? 'Add to Today' : 'Remove from Today', t => { t.star = star; }, n => `${plural(n)} ${star ? 'added to' : 'removed from'} Today`);
  };
  app.actions.bulkDone = () => {
    const list = app.pickedTasks();
    picked.clear();
    app.finishMany(list);
  };
  app.actions.bulkClear = () => app.clearPicks();
  app.actions.bulkDelete = () => {
    const n = picked.size;
    app.openModal(`<h2>Delete ${plural(n)}?</h2><p>You can undo this until you close Taskmaster.</p><div class="modal-acts"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary danger-fill" data-act="bulkDeleteYes">Delete</button></div>`);
  };
  app.actions.bulkDeleteYes = () => {
    const list = app.pickedTasks(), n = list.length;
    app.closeModal();
    picked.clear();
    if (list.some(t => t.id === app.ui.panelId)) app.ui.panelId = null;
    app.fx.sound('remove');
    list.slice(0, 12).forEach(t => app.fx.poof(app.fx.lift(app.taskEl(t.id))));
    app.change('Delete tasks', () => {
      const ids = new Set(list.map(t => t.id));
      list.forEach(t => C.pauseTimer(t, new Date()));
      app.data.tasks = app.data.tasks.filter(t => !ids.has(t.id));
    }, { toast: `Deleted ${plural(n)}` });
  };
  document.addEventListener('change', ev => {
    if (ev.target.id === 'bulkDue') {
      const v = ev.target.value || null;
      ev.target.blur();
      changeAll('Change due date', t => { t.due = v; if (v) t.recurrenceAnchorDay = Number(v.slice(8)); else t.dueTime = null; }, n => (v ? `${plural(n)} due ${C.fmtDay(v)}` : `Due date removed from ${plural(n)}`));
    }
    if (ev.target.id === 'bulkClient') {
      const v = app.rememberClient(ev.target.value);
      ev.target.blur();
      changeAll('Change client', t => { t.clientTag = v; }, n => (v ? `${plural(n)} tagged ${v}` : `Client removed from ${plural(n)}`));
    }
  });
  /* Everything showing that can be selected, for Ctrl + A. */
  app.pickAllShowing = function () {
    const found = document.querySelectorAll('#view [data-note], #view [data-taskel]');
    const ids = [...found].filter(el => el.offsetWidth && !el.classList.contains('dim')).map(el => el.dataset.note || el.dataset.taskel);
    app.addPicks(ids);
  };

  /* Shift or Ctrl + click in the list and columns. Notes on the board handle this as they're dragged. */
  const pickTarget = ev => {
    const el = ev.target.closest && ev.target.closest('#listView [data-row], #columnsView [data-card]');
    return el && !ev.target.closest('button,input,label,a') ? el : null;
  };
  document.addEventListener('mousedown', ev => { if ((ev.shiftKey || ev.ctrlKey || ev.metaKey) && pickTarget(ev)) ev.preventDefault(); });
  document.addEventListener('click', ev => {
    const el = pickTarget(ev);
    if (!el) return;
    if (ev.shiftKey || ev.ctrlKey || ev.metaKey) {
      ev.stopPropagation();
      ev.preventDefault();
      app.togglePick(el.dataset.row || el.dataset.card);
    } else app.clearPicks();
  }, true);
})(window);

/* Areas: labelled parts of the board, such as one for each client. */
(function (root) {
  'use strict';
  const C = root.TMCore, app = root.TMApp;
  const $ = app.$, esc = C.esc;

  const areas = () => app.data.areas;
  const area = id => areas().find(a => a.id === id);
  const areaEl = id => $(`#world [data-area="${CSS.escape(id)}"]`);
  const heightOf = id => { const el = app.noteEl(id); return el ? el.offsetHeight : 205; };
  const widthOf = id => C.noteWidth(app.task(id));

  function areaHTML(a) {
    return `<section class="area" data-area="${esc(a.id)}" style="left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px">
      <div class="area-head" title="Drag to move this area and its notes">
        <span class="area-move" aria-hidden="true">⠿</span>
        <input class="area-name" data-area-name="${esc(a.id)}" list="areaTags" value="${esc(a.name)}" size="${Math.max(16, a.name.length + 2)}" placeholder="Client or group name" aria-label="Area name">
        <span class="sp"></span>
        <button class="iconbtn" data-act="deleteArea" data-id="${esc(a.id)}" aria-label="Delete area" title="Delete this area. Its notes stay on the board.">✕</button>
      </div>
      <span class="area-grip" data-area-grip title="Drag to resize" aria-hidden="true"></span>
    </section>`;
  }
  app.areasHTML = () => `<datalist id="areaTags">${app.clientNames().map(x => `<option value="${esc(x)}">`).join('')}</datalist>${areas().map(areaHTML).join('')}`;
  app.areaRects = () => areas().map(a => ({ x: a.x, y: a.y, w: a.w, h: a.h }));

  /* ---------- creating and removing ---------- */
  app.actions.newArea = () => {
    const view = app.visibleWorld(), size = { w: 928, h: 360 };
    const rects = [...app.noteRects(), ...app.areaRects()];
    const at = C.findFreeSpot(rects, { x: view.x, y: view.y, w: Math.max(view.w, size.w + 40), h: 20000 }, size);
    const a = C.newArea({ ownerId: app.data.owner.id, ...at, ...size });
    app.change('Add area', () => areas().push(a));
    app.showWorldRect(a);
    app.fx.sound('create');
    const input = $(`[data-area-name="${CSS.escape(a.id)}"]`);
    if (input) input.focus();
  };
  app.actions.deleteArea = el => {
    const a = area(el.dataset.id);
    if (!a) return;
    app.change('Delete area', () => { app.data.areas = areas().filter(x => x !== a); }, { toast: `Area deleted${a.name ? `: ${a.name}` : ''}. Its notes stay on the board.` });
  };
  app.actions.clientAreas = () => {
    const list = app.boardTasks();
    if (!list.some(t => (t.clientTag || '').trim())) {
      app.toast('No notes have a client yet. Add one with #name, or in a note\'s details.', { ms: 5000 });
      return;
    }
    const view = app.visibleWorld();
    const base = C.assignAreas(list, areas(), heightOf, widthOf);
    const made = C.clientAreas(list, areas(), { x: view.x + 24, y: view.y + 20, w: view.w - 48, ownerId: app.data.owner.id });
    const result = C.tidyBoard(list, made.areas, heightOf, widthOf, { x: view.x + 24, y: view.y + 20, w: Math.max(C.NOTE_W, view.w - 48) }, { ...base, ...made.assign });
    app.change('Make client areas', () => {
      app.data.areas = result.areas;
      for (const t of list) t.position = result.positions[t.id];
    }, { toast: made.created ? `Made ${made.created} client area${made.created === 1 ? '' : 's'}` : 'Notes moved into their client areas' });
    requestAnimationFrame(() => app.fitAll());
  };
  /* Tidies inside each area, and everything else below them. */
  app.tidyWithAreas = function (list, frame) {
    const assign = C.assignAreas(list, areas(), heightOf, widthOf);
    const result = C.tidyBoard(list, areas(), heightOf, widthOf, frame, assign);
    app.change('Tidy up', () => {
      app.data.areas = result.areas;
      for (const t of list) t.position = result.positions[t.id];
    }, { toast: 'Notes tidied' });
  };

  /* ---------- where notes land ---------- */
  /* Where a new note with this client should look for space, if it has an area. */
  app.spotInClientArea = function (t, rects, size) {
    const a = C.areaForClient(areas(), t.clientTag);
    if (!a) return null;
    const at = C.findFreeSpot(rects, { x: a.x, y: a.y + C.AREA_HEAD - 20, w: a.w, h: 20000 }, size);
    fitArea(a, { ...at, ...size });
    return at;
  };
  function fitArea(a, rect) {
    const next = C.grownArea(a, rect);
    if (next.w === a.w && next.h === a.h) return;
    a.w = next.w;
    a.h = next.h;
    const el = areaEl(a.id);
    if (el) { el.style.width = a.w + 'px'; el.style.height = a.h + 'px'; }
  }
  /* A note dropped in an area, even at its edge, ends up fully inside. */
  app.fitNoteInArea = function (t) {
    const w = widthOf(t.id), h = heightOf(t.id);
    const a = C.areaAt(areas(), t.position.x + w / 2, t.position.y + h / 2);
    if (a) fitArea(a, { x: t.position.x, y: t.position.y, w, h });
  };
  app.showDropArea = function (x, y) {
    let over = null;
    if (x != null) over = document.elementsFromPoint(x, y).map(n => n.closest && n.closest('.area')).find(Boolean) || null;
    document.querySelectorAll('.area.drop').forEach(n => { if (n !== over) n.classList.remove('drop'); });
    if (over) over.classList.add('drop');
  };

  /* ---------- dragging ---------- */
  function track(onMove, onDone) {
    const up = e => {
      removeEventListener('pointermove', onMove); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      onDone(e);
    };
    addEventListener('pointermove', onMove); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }
  /* Moves an area along with the notes inside it. */
  app.moveArea = function (ev, el) {
    ev.preventDefault();
    const a = area(el.dataset.area), zoom = app.prefs().zoom, sx = ev.clientX, sy = ev.clientY;
    const start = { x: a.x, y: a.y };
    const list = app.boardTasks();
    const assign = C.assignAreas(list, areas(), heightOf, widthOf);
    const members = list.filter(t => assign[t.id] === a.id).map(t => ({ t, el: app.noteEl(t.id), x: t.position.x, y: t.position.y }));
    let moved = false;
    el.classList.add('moving-area');
    track(e => {
      const dx = (e.clientX - sx) / zoom, dy = (e.clientY - sy) / zoom;
      if (!moved && Math.hypot(dx, dy) < 3) return;
      moved = true;
      el.style.left = start.x + dx + 'px';
      el.style.top = start.y + dy + 'px';
      for (const m of members) if (m.el) { m.el.style.left = m.x + dx + 'px'; m.el.style.top = m.y + dy + 'px'; }
    }, e => {
      el.classList.remove('moving-area');
      if (!moved) return;
      const dx = Math.round((e.clientX - sx) / zoom), dy = Math.round((e.clientY - sy) / zoom);
      if (e.type === 'pointercancel') { app.render(); return; }
      app.remember('Move area');
      a.x = start.x + dx;
      a.y = start.y + dy;
      for (const m of members) m.t.position = { x: m.x + dx, y: m.y + dy };
      app.scheduleSave();
    });
  };
  app.resizeArea = function (ev, el) {
    ev.preventDefault();
    const a = area(el.dataset.area), zoom = app.prefs().zoom, sx = ev.clientX, sy = ev.clientY;
    const start = { w: a.w, h: a.h };
    let w = a.w, h = a.h, moved = false;
    track(e => {
      moved = true;
      w = Math.round(Math.max(C.AREA_MIN_W, start.w + (e.clientX - sx) / zoom));
      h = Math.round(Math.max(C.AREA_MIN_H, start.h + (e.clientY - sy) / zoom));
      el.style.width = w + 'px';
      el.style.height = h + 'px';
    }, e => {
      if (!moved) return;
      if (e.type === 'pointercancel') { app.render(); return; }
      app.remember('Resize area');
      a.w = w;
      a.h = h;
      app.scheduleSave();
    });
  };

  /* ---------- naming ---------- */
  document.addEventListener('change', ev => {
    const id = ev.target.dataset && ev.target.dataset.areaName;
    if (!id) return;
    const a = area(id), v = ev.target.value.trim();
    if (a && a.name !== v) app.change('Rename area', () => { a.name = v; });
  });
  document.addEventListener('keydown', ev => {
    if (ev.target.dataset && ev.target.dataset.areaName && ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); }
  });
})(window);

/* The two other task views: a normal to-do list, and Trello-style columns. */
(function (root) {
  'use strict';
  const C = root.TMCore, app = root.TMApp;
  const $ = app.$, esc = C.esc;

  const paper = t => (t.color === 'white' ? '#d9dcdf' : C.COLORS[t.color]);
  const visible = () => app.tasks().filter(app.matchesFilters);
  const expanded = new Set();

  /* Keeps a half-typed task and the cursor in place when the view redraws. */
  function redraw(host, html) {
    const active = document.activeElement;
    const focusId = active && host.contains(active) && active.dataset.addtask ? active.dataset.addtask : null;
    const caret = focusId ? active.selectionStart : 0;
    const typed = {};
    host.querySelectorAll('[data-addtask]').forEach(i => { typed[i.dataset.addtask] = i.value; });
    const scrolls = {};
    host.querySelectorAll('[data-scrollkey]').forEach(n => { scrolls[n.dataset.scrollkey] = n.scrollTop; });
    host.innerHTML = html;
    host.querySelectorAll('[data-addtask]').forEach(i => { if (typed[i.dataset.addtask]) i.value = typed[i.dataset.addtask]; });
    host.querySelectorAll('[data-scrollkey]').forEach(n => { n.scrollTop = scrolls[n.dataset.scrollkey] || 0; });
    if (focusId) {
      const again = host.querySelector(`[data-addtask="${focusId}"]`);
      if (again) { again.focus(); again.setSelectionRange(caret, caret); }
    }
  }
  const timerButton = t => (C.isDone(t) ? '' : `<button class="play" data-act="timer" data-id="${esc(t.id)}" aria-label="${t.timerStartedAt ? 'Pause' : 'Start'} timer" title="${t.timerStartedAt ? 'Pause' : 'Start'} timer">${t.timerStartedAt ? '❚❚' : '▶'}</button>`);
  const starButton = t => `<button class="mini star ${t.star ? 'is' : ''}" data-act="star" data-id="${esc(t.id)}" aria-label="${t.star ? 'Remove from' : 'Add to'} today" aria-pressed="${t.star}" title="Today">${t.star ? '★' : '☆'}</button>`;
  const checkButton = t => `<button class="mini check ${C.isDone(t) ? 'is' : ''}" data-act="toggleDone" data-id="${esc(t.id)}" aria-label="${C.isDone(t) ? 'Reopen' : 'Mark as done'}" title="${C.isDone(t) ? 'Reopen' : 'Mark as done'}">✓</button>`;
  const spent = t => app.spentHTML(t);
  const subCount = t => (t.subtasks.length ? `${t.subtasks.filter(s => s.done).length} of ${t.subtasks.length}` : '');

  /* ---------- list ---------- */
  function rowHTML(t) {
    const due = C.dueLabel(t, app.today(), new Date());
    const tag = app.tagLine(t);
    const open = expanded.has(t.id);
    return `<div class="lrow ${esc(t.priority)} ${t.timerStartedAt ? 'on' : ''}" data-taskel="${esc(t.id)}" data-row="${esc(t.id)}" tabindex="0" aria-label="${esc(t.title)}">
      <div class="lline" data-act="openPanel" data-id="${esc(t.id)}" style="--c:${paper(t)}">
        ${app.prefs().listSort === 'order' ? '<span class="lgrip" aria-hidden="true" title="Drag to move">⠿</span>' : ''}
        ${checkButton(t)}
        ${t.subtasks.length ? `<button class="lchev ${open ? 'open' : ''}" data-act="toggleExpand" data-id="${esc(t.id)}" aria-expanded="${open}" aria-label="Show subtasks">›</button>` : '<span class="lchev none"></span>'}
        <span class="lmain"><span class="ltitle">${esc(t.title)}</span>${tag ? `<span class="ltag">${esc(tag)}</span>` : ''}<span class="added">${esc(C.addedLabel(t, app.today()))}</span></span>
        ${t.subtasks.length ? `<span class="lcount">${subCount(t)}</span>` : ''}
        ${C.priorityBadge(t)}
        <span class="due ${due.kind}" data-due="${esc(t.id)}">${esc(due.text)}</span>
        <span class="ltime">${timerButton(t)}${spent(t)}</span>
        ${starButton(t)}
      </div>
      ${open ? `<div class="lsubs">${t.subtasks.map(s => `<label class="${s.done ? 'd' : ''}"><input type="checkbox" data-subtick="${esc(s.id)}" data-task="${esc(t.id)}" ${s.done ? 'checked' : ''}><span>${esc(s.name)}</span></label>`).join('')}</div>` : ''}
    </div>`;
  }
  app.renderList = function () {
    const host = $('#listView');
    if (!host) return;
    const myOrder = app.prefs().listSort === 'order';
    const filtering = app.ui.search.trim() || app.ui.colorFilter || app.ui.focus;
    const shown = visible();
    let body;
    if (myOrder) {
      const rows = C.listOrder(shown);
      body = rows.length ? `<section class="lgroup lflat" id="listRows">${rows.map(rowHTML).join('')}</section>` : '';
    } else {
      body = C.listGroups(shown, app.today()).map(g => `<section class="lgroup"><h2 class="${g.key === 'overdue' ? 'late' : ''}">${esc(g.label)} <span>${g.items.length}</span></h2>${g.items.map(rowHTML).join('')}</section>`).join('');
    }
    if (!body) body = `<div class="empty inline"><h2>${filtering ? 'Nothing matches' : 'All clear'}</h2><p>${filtering ? 'Try clearing the search, colour or Today filter.' : 'Add your first task above.'}</p></div>`;
    redraw(host, `<div class="llist" data-scrollkey="list"><div class="lwrap">
      <div class="ltop"><input class="ladd" data-addtask="list" autocomplete="off" placeholder="Add a task, e.g. Monthly report fri !high #clinic" aria-label="Add a task">
      <span class="seg" role="group" aria-label="List order">${[['order', 'My order'], ['date', 'By date']].map(([k, l]) => `<button class="${app.prefs().listSort === k ? 'on' : ''}" data-act="listSort" data-v="${k}" aria-pressed="${app.prefs().listSort === k}">${l}</button>`).join('')}</span></div>
      ${body}</div></div>`);
  };
  app.actions.listSort = el => { app.prefs().listSort = el.dataset.v; app.commit(); };
  app.actions.toggleExpand = el => {
    const id = el.dataset.id;
    if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    app.renderList();
  };

  /* ---------- columns ---------- */
  function cardHTML(t) {
    const due = C.dueLabel(t, app.today(), new Date());
    const tag = app.tagLine(t);
    const doneCount = t.subtasks.filter(s => s.done).length;
    const pct = t.subtasks.length ? Math.round(doneCount / t.subtasks.length * 100) : 0;
    return `<article class="kcard ${esc(t.priority)} ${C.isDone(t) ? 'done' : ''} ${t.timerStartedAt ? 'on' : ''}" data-taskel="${esc(t.id)}" data-card="${esc(t.id)}" data-act="openPanel" data-id="${esc(t.id)}" style="--c:${paper(t)}" tabindex="0" aria-label="${esc(t.title)}">
      <div class="khead">${C.priorityBadge(t)}${t.due || !C.isDone(t) ? `<span class="due ${due.kind}" data-due="${esc(t.id)}">${esc(due.text)}</span>` : ''}</div>
      <h3>${esc(t.title)}</h3>
      ${tag ? `<div class="ktag">${esc(tag)}</div>` : ''}
      <div class="added">${esc(C.addedLabel(t, app.today()))}</div>
      ${t.subtasks.length ? `<div class="kprog"><div class="prog"><i style="width:${pct}%"></i></div><span>${subCount(t)}</span></div>` : ''}
      <div class="kfoot">${timerButton(t)}${spent(t)}<span class="sp"></span>${C.isDone(t) ? '' : starButton(t)}${checkButton(t)}</div>
    </article>`;
  }
  app.renderColumns = function () {
    const host = $('#columnsView');
    if (!host) return;
    const cols = C.columnGroups(visible(), app.today());
    redraw(host, `<div class="kcols">${cols.map(c => `<section class="kcol" data-col="${c.key}" ${c.key === 'done' ? 'id="doneCol"' : ''}>
        <h2>${esc(c.label)} <span>${c.items.length}</span></h2>
        <div class="kbody" data-scrollkey="col-${c.key}">${c.items.map(cardHTML).join('') || `<p class="kempty">${c.key === 'done' ? 'Finished tasks land here today, then stay in the Done tray.' : 'Drag a card here.'}</p>`}</div>
        ${c.key === 'done'
          ? `<button class="linkbtn kmore" data-act="toggleTray">Open Done tray (${app.tasks().filter(t => C.isDone(t)).length})</button>`
          : `<input class="kadd" data-addtask="${c.key}" autocomplete="off" placeholder="+ Add a task" aria-label="Add a task to ${esc(c.label)}">`}
      </section>`).join('')}</div>`);
  };

  /* ---------- adding from the list or a column ---------- */
  document.addEventListener('keydown', ev => {
    const where = ev.target.dataset && ev.target.dataset.addtask;
    if (!where || ev.key !== 'Enter') return;
    ev.preventDefault();
    const fields = where === 'waiting' ? { status: 'waiting' } : {};
    if (app.createFromText(ev.target.value, fields)) {
      ev.target.value = '';
      const again = document.querySelector(`[data-addtask="${where}"]`);
      if (again) { again.value = ''; again.focus(); }
    }
  });

  document.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.card) { ev.preventDefault(); app.openPanel(ev.target.dataset.card); }
  });

  /* ---------- moving list rows ---------- */
  function saveRowOrder(id, beforeId, afterId) {
    const everyone = C.listOrder(app.tasks()).map(t => t.id);
    const next = C.reorderIds(everyone, id, beforeId, afterId);
    if (next.join() === everyone.join() && Number.isFinite(app.task(id).listRank)) return;
    app.change('Move task', () => {
      next.forEach((rowId, i) => { app.task(rowId).listRank = i; });
      app.task(id).updatedAt = new Date().toISOString();
    });
    app.fx.sound('tick');
  }
  document.addEventListener('pointerdown', ev => {
    const row = ev.target.closest && ev.target.closest('#listRows [data-row]');
    if (!row || ev.button !== 0 || ev.target.closest('button,input,label,a')) return;
    const id = row.dataset.row, host = $('#listRows'), scroller = row.closest('.llist');
    const sx = ev.clientX, sy = ev.clientY, r = row.getBoundingClientRect(), oy = sy - r.top;
    let ghost = null, place = null, lastY = sy, raf = 0, before = null;
    const others = () => [...host.querySelectorAll('[data-row]')].filter(n => n !== row);
    const position = y => {
      lastY = y;
      ghost.style.top = y - oy + 'px';
      before = others().find(n => { const b = n.getBoundingClientRect(); return y < b.top + b.height / 2; }) || null;
      host.insertBefore(place, before);
    };
    /* Scrolls the list while a row is held near its top or bottom edge. */
    const autoScroll = () => {
      const box = scroller.getBoundingClientRect(), edge = 56;
      const speed = lastY < box.top + edge ? -9 : lastY > box.bottom - edge ? 9 : 0;
      if (speed) { scroller.scrollTop += speed; position(lastY); }
      raf = requestAnimationFrame(autoScroll);
    };
    const move = e => {
      if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) < 5) return;
      if (!ghost) {
        ghost = row.cloneNode(true);
        ghost.classList.add('lghost');
        ghost.style.left = r.left + 'px';
        ghost.style.width = r.width + 'px';
        document.body.appendChild(ghost);
        place = document.createElement('div');
        place.className = 'kplace';
        place.style.height = r.height + 'px';
        row.style.display = 'none';
        document.body.classList.add('dragging-card');
        raf = requestAnimationFrame(autoScroll);
      }
      position(e.clientY);
    };
    const up = e => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (!ghost) return;
      cancelAnimationFrame(raf);
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
      ghost.remove();
      place.remove();
      row.style.display = '';
      document.body.classList.remove('dragging-card');
      if (e.type === 'pointercancel') return;
      const shown = others();
      saveRowOrder(id, before ? before.dataset.row : null, before ? null : (shown.length ? shown[shown.length - 1].dataset.row : null));
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  document.addEventListener('keydown', ev => {
    const row = ev.target.dataset && ev.target.dataset.row ? ev.target : null;
    if (!row) return;
    if (ev.key === 'Enter') { ev.preventDefault(); app.openPanel(row.dataset.row); return; }
    if (!ev.altKey || !['ArrowUp', 'ArrowDown'].includes(ev.key) || app.prefs().listSort !== 'order') return;
    ev.preventDefault();
    const id = row.dataset.row;
    const shown = [...document.querySelectorAll('#listRows [data-row]')].map(n => n.dataset.row);
    const at = shown.indexOf(id);
    if (ev.key === 'ArrowUp' && at > 0) saveRowOrder(id, shown[at - 1], null);
    if (ev.key === 'ArrowDown' && at < shown.length - 1) saveRowOrder(id, shown[at + 2] || null, shown[at + 2] ? null : shown[at + 1]);
    const again = document.querySelector(`#listRows [data-row="${CSS.escape(id)}"]`);
    if (again) again.focus();
  });

  /* ---------- dragging cards ---------- */
  let suppressClick = false;
  document.addEventListener('click', ev => {
    if (suppressClick) { suppressClick = false; ev.stopPropagation(); ev.preventDefault(); }
  }, true);
  document.addEventListener('pointerdown', ev => {
    const card = ev.target.closest && ev.target.closest('[data-card]');
    if (!card || ev.button !== 0 || ev.target.closest('button,input,label,a')) return;
    const id = card.dataset.card, sx = ev.clientX, sy = ev.clientY;
    const r = card.getBoundingClientRect();
    const ox = sx - r.left, oy = sy - r.top;
    let ghost = null, place = null, target = null;
    const move = e => {
      if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) < 5) return;
      if (!ghost) {
        ghost = card.cloneNode(true);
        ghost.classList.add('kghost');
        ghost.style.width = r.width + 'px';
        document.body.appendChild(ghost);
        place = document.createElement('div');
        place.className = 'kplace';
        place.style.height = r.height + 'px';
        card.classList.add('kdragging');
        document.body.classList.add('dragging-card');
      }
      ghost.style.left = e.clientX - ox + 'px';
      ghost.style.top = e.clientY - oy + 'px';
      const col = document.elementsFromPoint(e.clientX, e.clientY).map(n => n.closest && n.closest('[data-col]')).find(Boolean);
      if (!col) { if (place.parentNode) place.remove(); target = null; return; }
      const body = col.querySelector('.kbody');
      const cards = [...body.querySelectorAll('[data-card]')].filter(c => c !== card);
      const before = cards.find(c => { const b = c.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; });
      body.insertBefore(place, before || null);
      target = { key: col.dataset.col, index: before ? cards.indexOf(before) : cards.length, order: cards.map(c => c.dataset.card) };
    };
    const up = e => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (!ghost) return;
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
      ghost.remove();
      if (place.parentNode) place.remove();
      card.classList.remove('kdragging');
      document.body.classList.remove('dragging-card');
      if (e.type !== 'pointercancel' && target) dropCard(id, target, e);
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  function dropCard(id, target, ev) {
    const t = app.task(id);
    if (!t) return;
    if (target.key === 'done') {
      if (!C.isDone(t)) { app.finish(t, { at: [ev.clientX, ev.clientY] }); }
      return;
    }
    const wasDone = C.isDone(t);
    app.change(wasDone ? 'Reopen task' : 'Move card', () => {
      if (wasDone) app.setDone(t, false);
      t.status = target.key;
      C.moveInOrder(target.order, id, target.index).forEach((cardId, i) => {
        const c = app.task(cardId);
        if (c) c.rank = i;
      });
      t.updatedAt = new Date().toISOString();
    }, wasDone ? { toast: `Reopened: ${t.title}` } : undefined);
    if (wasDone) app.fx.sound('restore');
  }
})(window);

/* The calendar: off, a week strip, or a month panel. Tasks can be dragged to a new day. */
(function (root) {
  'use strict';
  const C = root.TMCore, app = root.TMApp;
  const $ = app.$, esc = C.esc;

  function segHTML(seg) {
    const t = seg.task, today = app.today();
    const cls = [C.isDone(t) ? 'done' : '', C.isOverdue(t, today, new Date()) ? 'late' : '', t.color === 'white' ? 'plain' : '', seg.continuesLeft ? 'cl' : '', seg.continuesRight ? 'cr' : ''].join(' ');
    return `<button class="chip ${cls}" data-chip="${esc(t.id)}" style="grid-column:${seg.col + 1} / span ${seg.span};grid-row:${seg.lane + 1};background:${C.COLORS[t.color]}" title="${esc(t.dueTime ? `${t.dueTime} ${t.title}` : t.title)}">${esc(t.dueTime ? `${t.dueTime} ${t.title}` : t.title)}</button>`;
  }
  function weekRow(days, opts) {
    const today = app.today();
    const segs = C.layoutWeek(days, app.tasks());
    const lanes = segs.reduce((m, s) => Math.max(m, s.lane + 1), 0);
    return `<div class="wrow ${opts.cls || ''}">
      <div class="wcells">${days.map(d => {
        const dn = Number(d.slice(8));
        const outside = opts.month != null && Number(d.slice(5, 7)) !== opts.month;
        return `<div class="wcell ${d === today ? 'today' : ''} ${outside ? 'out' : ''}" data-day="${d}"><span class="dnum">${opts.label ? esc(C.fmtDay(d).replace(/ \w+$/, '')) : dn}${opts.label && d === today ? ' · today' : ''}</span></div>`;
      }).join('')}</div>
      <div class="wsegs" style="grid-template-rows:repeat(${Math.max(lanes, 1)},auto)">${segs.map(segHTML).join('')}</div>
    </div>`;
  }

  function calNav(prevAct, nextAct, title, todayAct) {
    return `<div class="calnav"><button class="iconbtn" data-act="${prevAct}" aria-label="Previous">‹</button><b>${esc(title)}</b><button class="iconbtn" data-act="${nextAct}" aria-label="Next">›</button><button class="btn small" data-act="${todayAct}">Today</button></div>`;
  }
  app.renderCalendar = function () {
    const mode = app.prefs().calendar;
    const week = $('#weekStrip'), month = $('#monthPanel');
    if (!week || !month) return;
    week.classList.toggle('open', mode === 'week');
    month.classList.toggle('open', mode === 'month');
    week.innerHTML = '';
    month.innerHTML = '';
    if (mode === 'week') {
      const start = app.ui.weekCursor || C.weekStart(app.today());
      const days = C.weekDays(start);
      week.innerHTML = calNav('weekPrev', 'weekNext', `${C.fmtDay(days[0]).slice(4)} – ${C.fmtDay(days[6]).slice(4)}`, 'weekToday') + weekRow(days, { cls: 'strip', label: true });
    }
    if (mode === 'month') {
      const cur = app.ui.monthCursor || app.today().slice(0, 7);
      const [y, m] = cur.split('-').map(Number);
      month.innerHTML = calNav('monthPrev', 'monthNext', `${C.MONTH_FULL[m - 1]} ${y}`, 'monthToday') +
        `<div class="mhead">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<span>${d}</span>`).join('')}</div>` +
        `<div class="mgrid">${C.monthGrid(y, m).map(w => weekRow(w, { month: m })).join('')}</div>`;
    }
    // Moving the calendar changes the board's size, so the view needs no other adjustment.
  };
  const shiftWeek = n => { app.ui.weekCursor = C.addDays(app.ui.weekCursor || C.weekStart(app.today()), n); app.renderCalendar(); };
  const shiftMonth = n => {
    const [y, m] = (app.ui.monthCursor || app.today().slice(0, 7)).split('-').map(Number);
    const d = new Date(y, m - 1 + n, 1);
    app.ui.monthCursor = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    app.renderCalendar();
  };
  app.actions.weekPrev = () => shiftWeek(-7);
  app.actions.weekNext = () => shiftWeek(7);
  app.actions.weekToday = () => { app.ui.weekCursor = null; app.renderCalendar(); };
  app.actions.monthPrev = () => shiftMonth(-1);
  app.actions.monthNext = () => shiftMonth(1);
  app.actions.monthToday = () => { app.ui.monthCursor = null; app.renderCalendar(); };

  /* ---------- dragging a task to another day ---------- */
  const dayAt = (x, y) => {
    const el = document.elementsFromPoint(x, y).find(n => n.dataset && n.dataset.day);
    return el || null;
  };
  document.addEventListener('pointerdown', ev => {
    const chip = ev.target.closest && ev.target.closest('[data-chip]');
    if (!chip || ev.button !== 0) return;
    ev.preventDefault();
    const id = chip.dataset.chip;
    const grabCell = dayAt(ev.clientX, ev.clientY);
    const grabDay = grabCell && grabCell.dataset.day;
    const sx = ev.clientX, sy = ev.clientY;
    let ghost = null, over = null;
    const move = e => {
      if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) < 4) return;
      if (!ghost) {
        ghost = chip.cloneNode(true);
        ghost.classList.add('ghost');
        ghost.style.width = Math.min(chip.offsetWidth, 180) + 'px';
        document.body.appendChild(ghost);
      }
      ghost.style.left = e.clientX + 8 + 'px';
      ghost.style.top = e.clientY + 8 + 'px';
      const cell = dayAt(e.clientX, e.clientY);
      if (over && over !== cell) over.classList.remove('drop');
      if (cell) cell.classList.add('drop');
      over = cell;
    };
    const up = e => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (over) over.classList.remove('drop');
      if (!ghost) { app.jumpTo(id); return; }
      ghost.remove();
      const cell = dayAt(e.clientX, e.clientY);
      if (!cell || !grabDay || e.type === 'pointercancel') return;
      const n = C.daysBetween(grabDay, cell.dataset.day);
      if (!n) return;
      const t = app.task(id);
      if (!t) return;
      const next = C.shiftDates(t, n);
      app.change('Change date', () => { t.start = next.start; t.due = next.due; t.updatedAt = new Date().toISOString(); }, { toast: `${t.title} moved to ${C.fmtDay(next.due || next.start)}` });
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
})(window);

/* The Time tab: a week of tracked time, ready to copy into Basecamp. */
(function (root) {
  'use strict';
  const C = root.TMCore, app = root.TMApp;
  const $ = app.$, esc = C.esc;
  let lastDays = [];

  const currentWeek = () => app.ui.timeWeek || C.weekStart(app.today());
  function rangeLabel(start) {
    const days = C.weekDays(start);
    return `${C.fmtDay(days[0]).slice(4)} – ${C.fmtDay(days[6]).slice(4)}`;
  }
  app.views.time = function () {
    const p = app.prefs(), start = currentWeek();
    lastDays = C.timeRows(app.tasks(), start, { now: new Date(), rounding: p.rounding });
    const fmt = p.timeFormat;
    const total = lastDays.reduce((a, d) => a + d.total, 0);
    $('#view').innerHTML = `<div class="page">
      <div class="page-band">
        <div class="eyebrow">Time · Week</div>
        <h1>${esc(rangeLabel(start))}</h1>
        <div class="page-tools">
          <span class="calnav"><button class="iconbtn" data-act="timePrev" aria-label="Previous week">‹</button><button class="btn small" data-act="timeNow">This week</button><button class="iconbtn" data-act="timeNext" aria-label="Next week">›</button></span>
          <label class="inline"><span class="lab">Copy as</span><select id="timeFormat"><option value="hm" ${fmt === 'hm' ? 'selected' : ''}>1h 20m</option><option value="decimal" ${fmt === 'decimal' ? 'selected' : ''}>1.33</option></select></label>
          <label class="inline"><span class="lab">Round to</span><select id="timeRounding">${[[0, 'No rounding'], [5, '5 min'], [15, '15 min']].map(([v, l]) => `<option value="${v}" ${Number(p.rounding) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        </div>
      </div>
      <div class="page-body narrow">
        <div class="stats">
          <div class="stat dark"><b>${esc(C.formatDuration(total))}</b><span>tracked this week${C.hoursLabel(total) ? ` (${esc(C.hoursLabel(total))})` : ''}</span></div>
          <div class="stat"><b>${new Set(lastDays.flatMap(d => d.rows.map(r => r.taskId))).size}</b><span>tasks</span></div>
          <div class="stat"><b>${lastDays.reduce((a, d) => a + d.rows.filter(r => !r.logged).length, 0)}</b><span>still to log in Basecamp</span></div>
          <button class="btn primary stat-btn" data-act="copyWeek" ${lastDays.length ? '' : 'disabled'}>Copy week</button>
        </div>
        ${lastDays.length ? lastDays.map((d, di) => `<section class="card">
          <div class="card-head"><h2>${esc(C.fmtDay(d.date))}</h2><span class="sp"></span><b>${esc(C.formatDuration(d.total))}</b><button class="hrsbtn" data-act="copyHours" data-sec="${d.total}" title="Copy these hours for Basecamp">${esc(C.hoursLabel(d.total))}</button><button class="btn small" data-act="copyDay" data-d="${di}">Copy day</button></div>
          ${d.rows.map((r, ri) => `<div class="trow ${r.logged ? 'logged' : ''}">
            <label class="tick" title="Logged in Basecamp"><input type="checkbox" data-log="${di}:${ri}" ${r.logged ? 'checked' : ''} aria-label="Logged in Basecamp"><span>Logged</span></label>
            <button class="linkbtn tname" data-act="openPanel" data-id="${esc(r.taskId)}">${esc(r.title)}</button>
            ${r.clientTag ? `<span class="ttag">${esc(r.clientTag)}</span>` : ''}
            ${!r.logged && r.loggedSeconds ? `<small class="muted">${esc(C.formatDuration(r.loggedSeconds))} logged earlier</small>` : ''}
            ${r.running ? '<small class="live">running</small>' : ''}
            <span class="sp"></span><b class="tval">${esc(C.formatDuration(r.display))}</b><button class="hrsbtn" data-act="copyHours" data-sec="${r.display}" title="Copy these hours for Basecamp">${esc(C.hoursLabel(r.display))}</button>
            <button class="btn small" data-act="editTime" data-id="${esc(r.taskId)}" data-date="${d.date}">Edit</button>
            <button class="btn small" data-act="copyRow" data-r="${di}:${ri}">Copy</button>
          </div>`).join('')}
        </section>`).join('') : '<div class="empty inline"><h2>No time tracked this week</h2><p>Start a timer on any sticky note, and it appears here.</p></div>'}
      </div></div>`;
  };

  async function copy(text, label) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (!ok) { app.message('Copy this text', text); return; }
    }
    app.toast(`${label} copied`, { ms: 2500 });
  }
  /* Copies only the number, ready for Basecamp's hours box. */
  app.actions.copyHours = el => {
    const t = el.dataset.id ? app.task(el.dataset.id) : null;
    const secs = t ? C.taskSeconds(t, new Date()) : Number(el.dataset.sec);
    copy(C.formatHours(secs), C.formatHours(secs));
  };
  app.actions.copyWeek = () => copy(C.copyWeek(lastDays, app.prefs().timeFormat), 'Week');
  app.actions.copyDay = el => copy(C.copyDay(lastDays[Number(el.dataset.d)], app.prefs().timeFormat), 'Day');
  app.actions.copyRow = el => {
    const [d, r] = el.dataset.r.split(':').map(Number);
    copy(C.copyRow(lastDays[d].rows[r], app.prefs().timeFormat), 'Row');
  };
  app.actions.timePrev = () => { app.ui.timeWeek = C.addDays(currentWeek(), -7); app.render(); };
  app.actions.timeNext = () => { app.ui.timeWeek = C.addDays(currentWeek(), 7); app.render(); };
  app.actions.timeNow = () => { app.ui.timeWeek = null; app.render(); };
  document.addEventListener('change', ev => {

    if (ev.target.id === 'timeRounding') { app.prefs().rounding = Number(ev.target.value); app.commit(); return; }

      app.commit();
    }
  });
  /* ---------- correcting tracked time ---------- */
  let editing = null;
  function daySeconds(t, date, now) {
    if (!date) return C.taskSeconds(t, now);
    const tracked = t.timeSessions.filter(s => C.localDate(s.startedAt) === date).reduce((sum, s) => sum + (s.seconds || 0), 0);
    return tracked + (t.timerStartedAt && C.localDate(t.timerStartedAt) === date ? C.runningSeconds(t, now) : 0);
  }
  function editPreview() {
    const out = $('#editPreview'), input = $('#editTimeValue');
    if (!out || !input) return;
    const secs = C.parseTimeEdit(input.value);
    out.classList.toggle('warn', secs === null);
    if (secs === null) { out.textContent = 'Try a time like 15m, 1h 30m or 1.5h.'; return; }
    out.innerHTML = secs ? `This will count as <b>${esc(C.formatDuration(secs))}</b> (${esc(C.formatHours(secs))} h).` : 'This will clear the tracked time.';
  }
  app.actions.editTime = el => {
    const t = app.task(el.dataset.id);
    if (!t) return;
    editing = { id: t.id, date: el.dataset.date || null };
    const secs = daySeconds(t, editing.date, new Date());
    app.openModal(`<h2>Edit tracked <em>time</em></h2>
      <p><b>${esc(t.title)}</b>${editing.date ? ` on ${esc(C.fmtDay(editing.date))}` : ', all days'}. Now ${esc(C.formatDuration(secs))}${C.hoursLabel(secs) ? ` (${esc(C.hoursLabel(secs))})` : ''}.</p>
      <form data-form="editTime"><label class="field"><span>Time really spent</span><input id="editTimeValue" autocomplete="off" value="${esc(C.formatDuration(secs))}" placeholder="e.g. 15m or 1h 30m"></label>
      <p class="small" id="editPreview" role="status"></p>
      ${t.timerStartedAt ? '<p class="small muted">This task\'s timer will stop when you save.</p>' : ''}
      <div class="modal-acts"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary">Save</button></div></form>`);
    const input = $('#editTimeValue');
    input.select();
    editPreview();
  };
  document.addEventListener('input', ev => { if (ev.target.id === 'editTimeValue') editPreview(); });
  app.forms.editTime = () => {
    const t = editing && app.task(editing.id), secs = C.parseTimeEdit($('#editTimeValue').value);
    if (!t) { app.closeModal(); return; }

    const { date } = editing, now = new Date();
    app.closeModal();
    app.change('Edit time', () => {

    if (app.data && app.ui.tab === 'time' && app.runningTask() && !app.modalOpen() && !$('#panel').contains(document.activeElement) && !(document.activeElement && document.activeElement.matches('select'))) app.views.time();
  }, 30000);
})(window);

/* The Notes tab: simple dated notes with search. */
(function (root) {
  'use strict';
  const C = root.TMCore, app = root.TMApp;
  const $ = app.$, esc = C.esc;

  const note = id => app.data.notes.find(n => n.id === id);
  const firstLine = n => (n.title || n.body.split('\n')[0] || 'Untitled note').slice(0, 80);
  function filtered() {
    const q = app.ui.noteSearch.trim().toLowerCase();
    return app.data.notes
      .filter(n => !q || [n.title, n.body, n.clientTag].join(' ').toLowerCase().includes(q))
      .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)));
  }
  function listHTML() {
    const list = filtered();
    if (!list.length) return `<p class="muted pad">${app.ui.noteSearch ? 'No notes match that search.' : 'No notes yet.'}</p>`;
    return list.map(n => `<button class="nrow ${app.ui.noteId === n.id ? 'on' : ''}" data-act="pickNote" data-id="${esc(n.id)}"><b>${esc(firstLine(n))}</b><small>${esc(C.fmtDay(n.date))}${n.clientTag ? ` · ${esc(n.clientTag)}` : ''}</small></button>`).join('');
  }
  function editorHTML(n) {
    if (!n) return '<div class="empty inline"><h2>Meeting notes and anything else</h2><p>Select a note, or create a new one.</p></div>';
    const tags = app.clientNames();
    return `<input class="ntitle" data-n="title" value="${esc(n.title)}" placeholder="Title" aria-label="Note title">
      <div class="nmeta"><label class="inline"><span class="lab">Date</span><input type="date" data-n="date" value="${esc(n.date)}"></label>
      <label class="inline"><span class="lab">Client</span><input data-n="clientTag" list="noteTags" value="${esc(n.clientTag)}" placeholder="Optional"><datalist id="noteTags">${tags.map(x => `<option value="${esc(x)}">`).join('')}</datalist></label>
      <span class="sp"></span><button class="btn small danger" data-act="deleteNote">Delete</button></div>
      <textarea class="nbody" data-n="body" placeholder="Write here. Everything saves automatically." aria-label="Note text">${esc(n.body)}</textarea>`;
  }
  app.views.notes = function () {
    const active = document.activeElement;
    const inNotes = active && $('#notesRoot') && $('#notesRoot').contains(active) && active.matches('input,textarea');
    if (inNotes) { const l = $('#noteList'); if (l) l.innerHTML = listHTML(); return; }
    $('#view').innerHTML = `<div class="notes" id="notesRoot"><aside class="nside"><div class="nside-head"><button class="btn primary" data-act="newNote">+ New note</button><input id="noteSearch" type="search" class="search" placeholder="Search notes" aria-label="Search notes" value="${esc(app.ui.noteSearch)}"></div><div class="nlist" id="noteList">${listHTML()}</div></aside><section class="neditor" id="noteEditor">${editorHTML(note(app.ui.noteId))}</section></div>`;
  };
  const redrawEditor = () => { $('#noteEditor').innerHTML = editorHTML(note(app.ui.noteId)); $('#noteList').innerHTML = listHTML(); };
  app.actions.pickNote = el => { app.ui.noteId = el.dataset.id; redrawEditor(); };
  app.actions.newNote = () => {
    const n = C.newNote({ ownerId: app.data.owner.id, date: app.today() });
    app.data.notes.push(n);
    app.ui.noteId = n.id;
    app.ui.noteSearch = '';
    app.scheduleSave();
    app.views.notes();
    const t = $('.ntitle');
    if (t) t.focus();
  };
  app.actions.deleteNote = () => {
    const n = note(app.ui.noteId);
    if (!n) return;
    app.ui.noteId = null;
    app.change('Delete note', () => { app.data.notes = app.data.notes.filter(x => x.id !== n.id); }, { toast: `Note deleted: ${firstLine(n)}` });
    app.views.notes();
  };
  /* A client typed on a note joins the saved list once you leave the box. */
  document.addEventListener('change', ev => {
    if (!ev.target.dataset || ev.target.dataset.n !== 'clientTag') return;
    const n = note(app.ui.noteId);
    if (!n) return;
    n.clientTag = app.rememberClient(ev.target.value);
    ev.target.value = n.clientTag;
    $('#noteList').innerHTML = listHTML();
    app.scheduleSave();
  });
  document.addEventListener('input', ev => {
    if (ev.target.id === 'noteSearch') { app.ui.noteSearch = ev.target.value; $('#noteList').innerHTML = listHTML(); return; }
    const f = ev.target.dataset && ev.target.dataset.n;
    if (!f || !$('#noteEditor') || !$('#noteEditor').contains(ev.target)) return;
    const n = note(app.ui.noteId);
    if (!n) return;
    if (f === 'date' && !ev.target.value) return; // a note always keeps a date
    n[f] = ev.target.value;
    n.updatedAt = new Date().toISOString();
    $('#noteList').innerHTML = listHTML();
    app.scheduleSave();
  });
})(window);

/* The Clients tab: the saved list of clients, with what each one has going on. */
(function (root) {
  'use strict';
  const C = root.TMCore, app = root.TMApp;
  const $ = app.$, esc = C.esc;
  let filter = '';

  const clients = () => app.data.clients;
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  function statsHTML(c) {
    const s = C.clientStats(c.name, app.tasks(), app.data.notes);
    const time = s.seconds ? `${C.formatDuration(s.seconds)}${C.hoursLabel(s.seconds) ? ` (${C.hoursLabel(s.seconds)})` : ''}` : 'No time';
    return `<span class="cstat"><b>${s.open}</b> open</span><span class="cstat"><b>${s.done}</b> done</span><span class="cstat"><b>${s.notes}</b> note${s.notes === 1 ? '' : 's'}</span><span class="cstat ctime">${esc(time)}</span>`;
  }
  function rowsHTML() {
    const q = filter.trim().toLowerCase();
    const list = [...clients()].sort((a, b) => a.name.localeCompare(b.name)).filter(c => !q || c.name.toLowerCase().includes(q));
    if (!list.length) return `<div class="empty inline"><h2>${clients().length ? 'No clients match that search' : 'No clients yet'}</h2><p>${clients().length ? 'Try another name.' : 'Add one above, or type a client on any task and it will be saved here.'}</p></div>`;
    return list.map(c => `<div class="crow">
      <input class="cname" data-client-name="${esc(c.id)}" value="${esc(c.name)}" aria-label="Client name" title="Type to rename">
      ${statsHTML(c)}
      <span class="sp"></span>
      <button class="btn small" data-act="clientTasks" data-id="${esc(c.id)}">Show tasks</button>
      <button class="btn small danger" data-act="removeClient" data-id="${esc(c.id)}">Remove</button>
    </div>`).join('');
  }
  app.views.clients = function () {
    const n = clients().length;
    $('#view').innerHTML = `<div class="page">
      <div class="page-band">
        <div class="eyebrow">Clients</div>
        <h1>${plural(n, 'client')}</h1>
        <div class="page-tools">
          <form class="cadd" data-form="addClient"><input id="newClient" autocomplete="off" placeholder="New client name" aria-label="New client name"><button class="btn primary small">Add client</button></form>
          <input id="clientSearch" class="search" type="search" placeholder="Search clients" aria-label="Search clients" value="${esc(filter)}">
        </div>
      </div>
      <div class="page-body narrow"><div id="clientRows">${rowsHTML()}</div></div>
    </div>`;
  };
  const again = id => { const el = $(id); if (el) el.focus(); };

  app.forms.addClient = () => {
    const input = $('#newClient'), name = input.value.trim();
    if (!name) { input.focus(); return; }
    const existing = C.findClient(clients(), name);
    if (existing) { app.toast(`${existing.name} is already on your list`, { ms: 3000 }); input.select(); return; }
    filter = '';
    app.change('Add client', () => C.addClient(clients(), name, app.data.owner.id), { toast: `Client added: ${name}` });
    app.fx.sound('create');
    again('#newClient');
  };

  /* Renaming also updates every task, note, template and area using the old name. */
  document.addEventListener('change', ev => {
    const id = ev.target.dataset && ev.target.dataset.clientName;
    if (!id) return;
    const c = clients().find(x => x.id === id), name = ev.target.value.trim();
    if (!c) return;
    if (!name) { ev.target.value = c.name; return; }
    if (name === c.name) return;
    const other = C.findClient(clients(), name);
    if (other && other !== c) {
      app.openModal(`<h2>Combine these <em>clients?</em></h2><p><b>${esc(other.name)}</b> is already on your list. Everything under <b>${esc(c.name)}</b> will move to it.</p><div class="modal-acts"><button class="btn" data-act="cancelMerge">Cancel</button><button class="btn primary" data-act="doRename" data-id="${esc(id)}" data-name="${esc(name)}">Combine</button></div>`);
      return;
    }
    rename(id, name);
  });
  document.addEventListener('keydown', ev => {
    if (ev.target.dataset && ev.target.dataset.clientName && ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); }
  });
  function rename(id, name) {
    const old = clients().find(x => x.id === id).name;
    let merged = false;
    app.change('Rename client', () => { merged = C.renameClient(app.data, id, name).merged; }, { toast: merged ? '' : `${old} renamed to ${name}` });
    if (merged) app.toast(`${old} combined into ${C.findClient(clients(), name).name}`, { undo: true });
  }
  app.actions.doRename = el => { app.closeModal(); rename(el.dataset.id, el.dataset.name); };
  app.actions.cancelMerge = () => { app.closeModal(); app.views.clients(); };

  app.actions.clientTasks = el => {
    const c = clients().find(x => x.id === el.dataset.id);
    if (!c) return;
    app.ui.search = c.name;
    app.ui.tab = 'board';
    $('#view').innerHTML = '';
    app.render();
  };

  app.actions.removeClient = el => {
    const c = clients().find(x => x.id === el.dataset.id);
    if (!c) return;
    const s = C.clientStats(c.name, app.tasks(), app.data.notes), used = s.open + s.done + s.notes;
    if (!used) { removeNow(c.id, false); return; }
    const uses = [s.open + s.done ? plural(s.open + s.done, 'task') : '', s.notes ? plural(s.notes, 'note') : ''].filter(Boolean).join(' and ');
    app.openModal(`<h2>Remove <em>${esc(c.name)}?</em></h2><p>This client is on ${esc(uses)}. Removing it from your list keeps their history, but stops suggesting the name. You can also clear the name from them.</p>
      <div class="modal-acts wrap"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="removeClientYes" data-id="${esc(c.id)}" data-clear="1">Remove and clear from ${esc(uses)}</button><button class="btn primary" data-act="removeClientYes" data-id="${esc(c.id)}">Remove from list</button></div>`);
  };
  function removeNow(id, clear) {
    const c = clients().find(x => x.id === id);
    app.change('Remove client', () => C.removeClient(app.data, id, { clear }), { toast: `Client removed: ${c.name}` });
  }
  app.actions.removeClientYes = el => { app.closeModal(); removeNow(el.dataset.id, !!el.dataset.clear); };

  document.addEventListener('input', ev => {
    if (ev.target.id === 'clientSearch') { filter = ev.target.value; $('#clientRows').innerHTML = rowsHTML(); }
  });

  /* Clicking a client box opens its list straight away, where the browser allows it. */
  document.addEventListener('click', ev => {
    const el = ev.target;
    if (!el.matches || !el.matches('input[list]') || el.value) return;
    try { el.showPicker(); } catch (e) { /* typing still brings up the list */ }
  });
})(window);

/* First run, reconnecting a data folder, damaged-file protection and changing storage. */
(function (root) {
  'use strict';
  const C = root.TMCore, S = root.TMStorage, app = root.TMApp;
  const $ = app.$, esc = C.esc;
  let chosenName = '';

  function screen(html) {
    document.body.classList.add('setup-mode');
    $('#root').innerHTML = `<div class="setup"><div class="setup-card"><div class="brand big">${app.CROSS}<span>Task<b>master</b></span><small>1.0</small></div>${html}</div></div>`;
    const first = $('.setup input');
    if (first) first.focus();
  }

  function askName() {
    screen(`<div class="eyebrow">Welcome</div><h1>What's your <em>name?</em></h1>
      <p>Your tasks and notes stay on this computer, in your own list.</p>
      <form data-form="setupName"><label class="field"><span>Your name</span><input id="setupName" maxlength="60" autocomplete="name" required></label>
      <div class="modal-acts"><button class="btn primary">Continue</button></div></form>`);
  }
  function askStorage(changing) {
    const folderOk = S.supportsFolder();
    screen(`<div class="eyebrow">${changing ? 'Change storage' : 'Step 2 of 2'}</div><h1>Where should Taskmaster <em>save?</em></h1>
      <div class="choices">
        <button class="choice" data-act="useFolder" ${folderOk ? '' : 'disabled'}><b>A folder on this computer${folderOk ? ' (recommended)' : ''}</b><span>${folderOk ? 'Saves a file you can see and back up, plus five automatic backups. Choose an empty folder, or one you already use.' : 'This browser can\'t do this. Open Taskmaster in Chrome or Edge to use it.'}</span></button>
        <button class="choice" data-act="useBrowser"><b>In this browser</b><span>Nothing to set up, but clearing your browser data deletes your tasks, so export a backup file regularly.</span></button>
      </div>
      ${changing ? '<div class="modal-acts"><button class="btn" data-act="reloadApp">Cancel</button></div>' : ''}
      <p class="setup-error" id="setupError" role="alert"></p>`);
  }
  app.actions.reloadApp = () => location.reload();

  app.forms.setupName = () => {
    chosenName = $('#setupName').value.trim();
    if (chosenName) askStorage(false);
  };

  function showDamaged(store, err) {
    app.setStore(store);
    screen(`<div class="eyebrow">Your data is protected</div><h1>Your saved data <em>couldn't be read</em></h1>
      <p>${esc(err.message)} Nothing has been overwritten. You can restore an automatic backup, or use a different ${store.mode === 'folder' ? 'folder' : 'storage option'}.</p>
      <div class="modal-acts wrap">
        <button class="btn" data-act="changeStorage">Choose different storage</button>
        <button class="btn primary" data-act="restoreDamaged">See backups</button>
      </div><p class="setup-error" id="setupError" role="alert"></p>`);
  }
  /* Shows what each backup holds, so an older or empty one is never restored by surprise. */
  let restoreChoices = [];
  app.actions.restoreDamaged = async () => {
    const out = $('#setupError');
    try {
      const list = await app.store.listBackups();
      restoreChoices = list.map(text => { try { return { text, d: C.parseDataFile(text) }; } catch (e) { return null; } }).filter(Boolean);
      if (!restoreChoices.length) { out.textContent = 'There are no usable backups. If you have an exported backup file, choose different storage, then restore it from the person menu.'; return; }
      screen(`<div class="eyebrow">Your data is protected</div><h1>Choose a version to <em>restore</em></h1>
        <p>The damaged file will be kept as a separate copy.</p>
        <div class="rows">${restoreChoices.map((c, i) => `<div class="row"><span><b>${c.d.savedAt ? esc(new Date(c.d.savedAt).toLocaleString()) : 'Earlier version'}</b><br><small>${c.d.tasks.length} tasks, ${c.d.notes.length} notes</small></span><button class="btn small primary" data-act="restoreChoice" data-i="${i}">Restore</button></div>`).join('')}</div>
        <div class="modal-acts"><button class="btn" data-act="reloadApp">Back</button></div><p class="setup-error" id="setupError" role="alert"></p>`);
    } catch (e) { out.textContent = `That didn't work: ${e.message}`; }
  };
  app.actions.restoreChoice = async el => {
    const out = $('#setupError');
    try {
      await app.store.keepDamagedCopy();
      await app.store.replace(restoreChoices[Number(el.dataset.i)].text);
      location.reload();
    } catch (e) { out.textContent = `That didn't work: ${e.message}`; }
  };

  /* Opens the store. Returns false after showing an error, so damaged data is never replaced by accident. */
  async function openStore(store) {
    const text = await store.load();
    if (text == null) return { fresh: true };
    try {
      app.data = C.parseDataFile(text);
      app.setStore(store);
      return { fresh: false };
    } catch (e) {
      showDamaged(store, e);
      return null;
    }
  }

  async function beginNew(store) {
    app.data = C.emptyData(chosenName || 'Me');
    app.setStore(store);
    await store.save(C.serialize(app.data));
    let old = null;
    try { old = await store.readOldData(); } catch (e) { old = null; }
    offerImport(old);
  }
  function offerImport(old) {
    screen(`<div class="eyebrow">Almost there</div><h1>Bring your tasks from <em>Taskmaster 0.4?</em></h1>
      <p>${old ? 'Your earlier Taskmaster data was found here.' : 'Choose your <b>clients.json</b> file or a 0.4 backup file.'} Importing only reads it, and never changes it.</p>
      <div class="modal-acts wrap">
        <button class="btn" data-act="startFresh">Start with an empty board</button>
        ${old ? '<button class="btn" data-act="pickSetupImport">Choose another file</button><button class="btn primary" data-act="importFound">Review import</button>' : '<button class="btn primary" data-act="pickSetupImport">Choose file</button>'}
      </div>`);
    app.actions.importFound = () => app.previewImport(old, ok => { if (ok) begin(); });
  }
  function begin() {
    app.start();
  }
  app.actions.startFresh = () => begin();
  app.actions.pickSetupImport = () => app.pickFile(text => app.previewImport(text, ok => { if (ok) begin(); }));
  app.actions.changeStorage = () => { app.closePopover && $('#popover') && app.closePopover(); askStorage(!!app.data); };

  /* Moving to new storage takes your current tasks and notes along, unless that place already has data. */
  async function adopt(store, mode) {
    const carrying = app.data;
    const opened = await openStore(store);
    if (!opened) return;
    if (opened.fresh) {
      if (carrying) { app.data = carrying; app.setStore(store); await store.save(C.serialize(carrying)); location.reload(); return; }
      if (!chosenName) { askName(); return; }
      await beginNew(store);
      return;
    }
    if (carrying) { location.reload(); return; }
    begin();
  }
  app.actions.useFolder = async () => {
    const out = $('#setupError');
    let handle;
    try { handle = await root.showDirectoryPicker({ mode: 'readwrite', id: 'taskmaster-data' }); }
    catch (e) { if (e.name !== 'AbortError') out.textContent = `That folder can't be used: ${e.message}`; return; }
    try {
      await S.rememberFolder(handle);
      S.setMode('folder');
      await adopt(S.createFolderStore(handle), 'folder');
    } catch (e) { out.textContent = `That folder can't be used: ${e.message}`; }
  };
  app.actions.useBrowser = async () => {
    const out = $('#setupError');
    try {
      S.setMode('browser');
      await adopt(S.createBrowserStore(), 'browser');
    } catch (e) { out.textContent = `Browser storage isn't available: ${e.message}`; }
  };

  function showReconnect(handle) {
    screen(`<div class="eyebrow">Welcome back</div><h1>Reconnect your <em>data folder</em></h1>
      <p>For safety, your browser asks before Taskmaster can reopen <b>${esc(handle.name)}</b>.</p>
      <div class="modal-acts wrap"><button class="btn" data-act="changeStorage">Use different storage</button><button class="btn primary" data-act="reconnect">Reconnect</button></div>
      <p class="setup-error" id="setupError" role="alert"></p>`);
    app.actions.reconnect = async () => {
      const out = $('#setupError');
      try {
        if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted') { out.textContent = 'Permission wasn\'t given, so your data stays closed.'; return; }
        await adopt(S.createFolderStore(handle), 'folder');
      } catch (e) { out.textContent = `Your data folder couldn't be opened: ${e.message}. It may have been moved or renamed.`; }
    };
  }

  async function init() {
    const mode = S.getMode();
    try {
      if (mode === 'browser') { await adopt(S.createBrowserStore(), 'browser'); return; }
      if (mode === 'folder') {
        const handle = await S.recallFolder();
        if (handle) {
          const perm = await handle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') { await adopt(S.createFolderStore(handle), 'folder'); return; }
          showReconnect(handle);
          return;
        }
      }
    } catch (e) {
      screen(`<div class="eyebrow">Something went wrong</div><h1>Your data <em>couldn't be opened</em></h1><p>${esc(e.message)}. Nothing has been changed.</p><div class="modal-acts"><button class="btn" data-act="changeStorage">Choose storage</button><button class="btn primary" data-act="reloadApp">Try again</button></div>`);
      return;
    }
    askName();
  }
  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState !== 'loading') init();
})(window);

</script>
</body>
</html>
